name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: 📁 Prepare Deployment Package
        run: |
          mkdir -p deploy_dist
          # Copy static frontend export to deployment root
          cp -a frontend/out/. deploy_dist/
          # Copy backend PHP APIs
          cp -R backend deploy_dist/
          # Copy Apache .htaccess
          cp .htaccess deploy_dist/
          # Ensure config.php on server is NOT overwritten by git
          rm -f deploy_dist/backend/config.php

      - name: 🚀 Sync Files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy_dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/backend/config.php
            **/backend/storage/payment_screenshots/**
